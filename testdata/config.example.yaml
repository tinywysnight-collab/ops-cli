# Example opsx configuration.
# Copy to ~/.config/opsx/config.yaml and edit for your environment.
#
# `admin` vs `opr` (AWSOpr) mode is NOT stored here — it is a per-terminal
# runtime property (`opsx mode admin|opr` or the --opr flag). One config serves
# both modes.

regions: # department-approved regions, in interactive menu order
  - ap-southeast-2
  - ap-northeast-1
  - us-east-1

accounts:
  dev: # alias used on the command line
    account_id: "111111111111"
    description: "Dev citizen account"
    region: ap-southeast-2 # optional: STS/home region for this account's `opsx use`
  prod:
    account_id: "222222222222"
    description: "Prod citizen account"
    region: ap-southeast-2

clusters:
  dev-syd: # cluster alias
    account: dev # must reference an accounts entry
    region: ap-southeast-2
    name: dev-eks-cluster-01 # real EKS cluster name (for update-kubeconfig)
  dev-tok:
    account: dev
    region: ap-northeast-1
    name: dev-eks-tokyo
  prod-syd:
    account: prod
    region: ap-southeast-2
    name: prod-eks-cluster-01

auth:
  master_account_id: "000000000000"
  saml_provider_arn: "arn:aws:iam::000000000000:saml-provider/EntraID"
  region: us-east-1 # region for the master AssumeRoleWithSAML call (falls back to AWS_REGION)
  entra:
    app_id: "00000000-0000-0000-0000-000000000000" # Entra federated application ID
    username: "operator@example.com" # non-secret; password is prompted, never stored
    debug: false # set true to log the Entra/ADFS/MFA flow (steps + HTTP status codes) to stderr; URLs are redacted, secrets are never logged
    # Optional endpoint overrides; leave unset to use built-in defaults.
    # Fill these in to point at your tenant's real Entra/ADFS endpoints:
    # base_url: "https://login.example.com"
    # ms_login_url: "https://login.example.com/login"
    # myapps_url: "https://myapps.example.com"
  master_roles: # configurable master role NAMES, by mode
    admin: master_admin
    opr: master_AWSOpr
  citizen_roles: # configurable citizen role NAMES, by mode
    admin: Admin
    opr: AWSOpr
